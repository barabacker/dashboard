# Paths here are relative to this file's directory, so the repository root is `..`.
# Run it from the repo root: `.env` there sets COMPOSE_FILE, so plain `docker compose up` finds
# this file. Without a .env, pass it explicitly: `docker compose -f docker/compose.yaml up`.
name: dashboard

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashboard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dashboard} -d ${POSTGRES_DB:-dashboard}"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: &app_build
      context: ..
      dockerfile: docker/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    environment: &app_env
      DJANGO_DEBUG: "true"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashboard}
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: *app_build
    command: python manage.py run_worker
    environment: *app_env
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: *app_build
    command: python manage.py run_scheduler --loop
    environment: *app_env
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
