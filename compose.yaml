name: dashboard

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DJANGO_DEBUG: "${DJANGO_DEBUG:-1}"
    DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-django-insecure-change-me-before-deploy}"
    DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-*}"
    DJANGO_DB_PATH: /data/db.sqlite3
  volumes:
    # код прокинут внутрь: правки видны без пересборки образа
    - .:/app
    # база живёт на томе — переживает пересоздание контейнеров
    - data:/data

services:
  # Миграции прогоняются один раз до старта остальных сервисов:
  # у SQLite один писатель, параллельный migrate из двух контейнеров опасен.
  migrate:
    <<: *app
    command: python manage.py migrate --noinput

  web:
    <<: *app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Референсный раннер: в бою его место в репозитории парсеров
  runner:
    <<: *app
    command: python runner/runner.py
    environment:
      DASHBOARD_URL: http://web:8000
      RUNNER_TOKEN: "${RUNNER_TOKEN:-}"
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
    profiles: ["runner"]

volumes:
  data:
