[project]
name = "dashboard"
version = "0.1.0"
description = "Django-проект с админкой на Unfold"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2,<5.3",
    "django-unfold>=0.91",
    "huey>=3.4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[tool.ruff]
line-length = 110
target-version = "py311"
# .md исключён намеренно: ruff переформатирует примеры кода в README
exclude = [".venv", "staticfiles", "*/migrations/*", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core"]
