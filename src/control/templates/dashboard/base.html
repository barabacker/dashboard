<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Collection dashboard{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <style>
    :root {
      --fg: #1b1b1f; --bg: #fbfbfd; --muted: #6b6b76; --line: #e3e3ea; --card: #fff;
      --pending: #8a8a8a; --running: #0b6bcb; --succeeded: #1a7f37;
      --failed: #c92a2a; --cancelled: #9c6b00;
    }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e8e8ec; --bg: #131317; --muted: #9a9aa4; --line: #2b2b33; --card: #1b1b21; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 2rem 1.5rem; background: var(--bg); color: var(--fg);
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 1100px; margin: 0 auto; }
    header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.35rem; margin: 0; }
    h2 { font-size: 1rem; margin: 2rem 0 .6rem; text-transform: uppercase;
         letter-spacing: .06em; color: var(--muted); }
    a { color: inherit; }
    nav a { color: var(--muted); text-decoration: none; margin-left: 1rem; }
    nav a:hover { color: var(--fg); }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
              overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 640px; }
    th, td { text-align: left; padding: .55rem .8rem; border-bottom: 1px solid var(--line); }
    th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em;
         color: var(--muted); font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
    .status { font-weight: 600; font-size: .8rem; text-transform: uppercase;
              letter-spacing: .04em; }
    .status-pending { color: var(--pending); }
    .status-running { color: var(--running); }
    .status-succeeded { color: var(--succeeded); }
    .status-failed { color: var(--failed); }
    .status-cancelled { color: var(--cancelled); }
    .muted { color: var(--muted); }
    .tally { display: flex; gap: 1.2rem; flex-wrap: wrap; margin: 0 0 .6rem; padding: 0;
             list-style: none; font-size: .82rem; }
    button { font: inherit; font-size: .82rem; padding: .25rem .7rem; border-radius: 6px;
             border: 1px solid var(--line); background: transparent; color: inherit;
             cursor: pointer; }
    button:hover { border-color: var(--muted); }
    form { display: inline; }
    ul.messages { list-style: none; padding: 0; margin: 0 0 1rem; }
    ul.messages li { padding: .5rem .8rem; border-radius: 8px; border: 1px solid var(--line);
                     margin-bottom: .4rem; background: var(--card); }
    ul.messages li.error { border-color: var(--failed); color: var(--failed); }
    ul.messages li.warning { border-color: var(--cancelled); color: var(--cancelled); }
    .empty { padding: 1.2rem .8rem; color: var(--muted); }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Collection dashboard</h1>
    <nav>
      <a href="{% url 'admin:index' %}">Admin</a>
      <a href="{% url 'admin:control_config_changelist' %}">Configs</a>
      <a href="{% url 'admin:control_job_changelist' %}">Jobs</a>
    </nav>
  </header>

  {% if messages %}
    <ul class="messages">
      {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
    </ul>
  {% endif %}

  {% block content %}{% endblock %}
</main>
</body>
</html>
